name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.mmd'
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Documentation-only changes ─────────────────────────────────────────────
  # Every other job needs `code == 'true'`. `paths-ignore` used to live on
  # `pull_request` too: a docs-only PR then had NO check at all, and a required
  # status check that never reports blocks the merge forever. Computing it here
  # instead keeps a docs-only PR at a few seconds and gives the required
  # `CI gate` check something to report on every single PR.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Did anything other than documentation change?
        id: filter
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no base commit to diff against: assume code changed"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" "$GITHUB_SHA" || true)
          echo "changed files:"; printf '%s\n' "$changed"
          code=$(printf '%s\n' "$changed" | grep -vE '(\.md$|\.mmd$|^docs/)' | grep -c . || true)
          echo "code files: $code"
          if [ "$code" -gt 0 ]; then echo "code=true" >> "$GITHUB_OUTPUT"; else echo "code=false" >> "$GITHUB_OUTPUT"; fi

  test:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # this-descriptor is a path dependency (../this/crates/this-descriptor): check out
      # this-rs/this next to this crate. Ref: the integration branch until the module
      # `main` carries this-descriptor (integ/module-descriptor was merged into it);
      # THIS_RS_REF still overrides for a one-off run against another branch.
      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'main' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Place this-rs/this at ../this (Windows junction)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE/../this" -Target "$env:GITHUB_WORKSPACE/.deps/this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --verbose

  # Code coverage (unit tests only — integration tests use a subprocess)
  # The chain nothing tested: `this init` produces a project that COMPILES.
  # `this add target desktop` shipped for months with eight defects that made the generated
  # crate impossible to build; every template test passed, because rendering a template and
  # asserting on substrings says nothing about the result being a program.
  scaffold:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Scaffold compiles
    runs-on: ubuntu-latest
    # A full `cargo check` of a freshly generated project, cold registry included.
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'main' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-scaffold-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-scaffold-

      - name: Scaffold a project and compile it
        run: cargo test --test scaffold_compiles -- --ignored --nocapture

  # macOS only: this is where the generated desktop crate can actually be COMPILED.
  # Tauri needs its system libraries (webkit2gtk on Linux), which a bare runner does not
  # have; the macOS images ship them with the SDK. The `scaffold` job above stops at
  # `cargo metadata`, which proves the graph resolves but not that the crate builds —
  # seven of the eight defects that broke this template were compile errors.
  scaffold-desktop:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Scaffold desktop compiles
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'main' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-scaffold-desktop-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-scaffold-desktop-

      - name: Scaffold, and compile the Tauri crate
        env:
          SCAFFOLD_CHECK_DESKTOP: "1"
        run: cargo test --test scaffold_compiles -- --ignored --nocapture

  coverage:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # this-descriptor is a path dependency (../this/crates/this-descriptor): check out
      # this-rs/this next to this crate. Ref: the integration branch until the module
      # `main` carries this-descriptor (integ/module-descriptor was merged into it);
      # THIS_RS_REF still overrides for a one-off run against another branch.
      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'main' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Place this-rs/this at ../this (Windows junction)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE/../this" -Target "$env:GITHUB_WORKSPACE/.deps/this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      - name: Generate code coverage
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          cargo test -p this-cli
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fmt:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # this-descriptor is a path dependency (../this/crates/this-descriptor): check out
      # this-rs/this next to this crate. Ref: the integration branch until the module
      # `main` carries this-descriptor (integ/module-descriptor was merged into it);
      # THIS_RS_REF still overrides for a one-off run against another branch.
      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'main' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Place this-rs/this at ../this (Windows junction)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE/../this" -Target "$env:GITHUB_WORKSPACE/.deps/this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        # rustfmt on the tracked files: `cargo fmt` runs `cargo metadata`, which loads the
        # transitive path dependencies of this-rs/this (obrain, vite-rs) that the runner
        # does not have. Same check, no dependency resolution.
        run: git ls-files '*.rs' | xargs rustfmt --edition 2024 --check

  clippy:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # this-descriptor is a path dependency (../this/crates/this-descriptor): check out
      # this-rs/this next to this crate. Ref: the integration branch until the module
      # `main` carries this-descriptor (integ/module-descriptor was merged into it);
      # THIS_RS_REF still overrides for a one-off run against another branch.
      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'main' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Place this-rs/this at ../this (Windows junction)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE/../this" -Target "$env:GITHUB_WORKSPACE/.deps/this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  cross-platform:
    # Skipped when the change is documentation-only (see `changes`).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # this-descriptor is a path dependency (../this/crates/this-descriptor): check out
      # this-rs/this next to this crate. Ref: the integration branch until the module
      # `main` carries this-descriptor (integ/module-descriptor was merged into it);
      # THIS_RS_REF still overrides for a one-off run against another branch.
      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'main' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        if: runner.os != 'Windows'
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Place this-rs/this at ../this (Windows junction)
        if: runner.os == 'Windows'
        shell: pwsh
        run: New-Item -ItemType Junction -Path "$env:GITHUB_WORKSPACE/../this" -Target "$env:GITHUB_WORKSPACE/.deps/this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  # ── The one check a branch protection rule should require ──────────────────
  # `if: always()` makes it report even when a dependency failed, which is the
  # whole point: a red CI must be able to block a merge. A skipped job counts as
  # fine here, and that is honest — a docs-only PR genuinely had nothing to check.
  gate:
    name: CI gate
    if: always()
    needs: [changes, test, scaffold, scaffold-desktop, coverage, fmt, clippy, cross-platform]
    runs-on: ubuntu-latest
    steps:
      - name: Nothing failed, nothing was cancelled
        run: |
          results="${{ join(needs.*.result, ',') }}"
          echo "job results: $results"
          case ",$results," in
            *,failure,*|*,cancelled,*)
              echo "::error::at least one CI job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all jobs passed, or were skipped by design (documentation-only change)"

