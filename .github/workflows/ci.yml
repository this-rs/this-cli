name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # this-descriptor is a path dependency (../this/crates/this-descriptor): check out
      # this-rs/this next to this crate. Ref: the integration branch until the module
      # descriptor lands on main (then set the THIS_RS_REF variable or drop the default).
      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'integ/module-descriptor' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      - name: Run tests
        run: cargo test --verbose

  # Code coverage (unit tests only — integration tests use a subprocess)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # this-descriptor is a path dependency (../this/crates/this-descriptor): check out
      # this-rs/this next to this crate. Ref: the integration branch until the module
      # descriptor lands on main (then set the THIS_RS_REF variable or drop the default).
      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'integ/module-descriptor' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-coverage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-coverage-

      - name: Generate code coverage
        run: |
          source <(cargo llvm-cov show-env --export-prefix)
          cargo llvm-cov clean --workspace
          cargo test -p this-cli
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # this-descriptor is a path dependency (../this/crates/this-descriptor): check out
      # this-rs/this next to this crate. Ref: the integration branch until the module
      # descriptor lands on main (then set the THIS_RS_REF variable or drop the default).
      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'integ/module-descriptor' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        # rustfmt on the tracked files: `cargo fmt` runs `cargo metadata`, which loads the
        # transitive path dependencies of this-rs/this (obrain, vite-rs) that the runner
        # does not have. Same check, no dependency resolution.
        run: git ls-files '*.rs' | xargs rustfmt --edition 2024 --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # this-descriptor is a path dependency (../this/crates/this-descriptor): check out
      # this-rs/this next to this crate. Ref: the integration branch until the module
      # descriptor lands on main (then set the THIS_RS_REF variable or drop the default).
      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'integ/module-descriptor' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  cross-platform:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # this-descriptor is a path dependency (../this/crates/this-descriptor): check out
      # this-rs/this next to this crate. Ref: the integration branch until the module
      # descriptor lands on main (then set the THIS_RS_REF variable or drop the default).
      - name: Checkout this-rs/this (this-descriptor)
        uses: actions/checkout@v5
        with:
          repository: this-rs/this
          ref: ${{ vars.THIS_RS_REF || 'integ/module-descriptor' }}
          path: .deps/this

      - name: Place this-rs/this at ../this
        run: ln -sfn "$GITHUB_WORKSPACE/.deps/this" "$GITHUB_WORKSPACE/../this"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-build-

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
