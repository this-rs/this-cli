[package]
name = "this-cli"
version = "0.0.5"
edition = "2024"
authors = ["Riviere Théotime <t@ffs.holdings>"]
license = "MIT OR Apache-2.0"
description = "CLI toolkit for the this-rs entity-relationship framework — scaffold, develop, build, and expose projects via MCP"
repository = "https://github.com/this-rs/this"
keywords = ["cli", "entity", "framework", "scaffolding", "mcp"]
categories = ["command-line-utilities", "development-tools", "web-programming"]
readme = "README.md"

[[bin]]
name = "this"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "color"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
tera = "1"
colored = "2"
anyhow = "1"
toml_edit = "0.22"
ctrlc = "3"
regex = "1"
# Shared module descriptor (types, check, pluralizer). version + path: publishable, and
# the path resolves from a checkout of this-cli next to a checkout of this-rs/this.
this-descriptor = { version = "0.0.1", path = "../this/crates/this-descriptor", features = ["yaml", "pattern"] }

# La boucle du harnais, pilotable depuis un terminal (`this harness`).
# La feature `providers` branche le transport HTTP sur `this-llm-providers`.
this-harness = { version = "0.0.1", path = "../this/crates/this-harness", features = ["providers"] }
this-llm-providers = { version = "0.0.1", path = "../this/crates/this-llm-providers" }
this-agent = { version = "0.0.1", path = "../this/crates/this-agent" }
async-trait = "0.1"
# Le harnais est `!Send` : un runtime mono-thread suffit, et c'est le seul correct.
tokio = { version = "1", features = ["rt", "time", "signal", "macros"] }
toml = "0.8"
semver = "1"

# Signalling a whole dev process group (dev_status / dev_stop) needs `kill(2)`
# with a negative pid. No shell: the `kill` builtin of dash (Ubuntu's /bin/sh)
# does not accept the `--` separator before a negative pid, so shelling out
# silently failed there and the stop degraded to SIGKILL after the grace.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# `#[tokio::test]` : le toolbox `executer` attend sur `tokio::time::sleep`.
tokio = { version = "1", features = ["rt", "time", "macros"] }
tempfile = "3"
serial_test = "3"

# Standalone workspace root: without it, cargo walks up to the local
# /Users/.../this-rs/Cargo.toml workspace from a worktree under _wt-md and refuses to build.
[workspace]
